[package]
name = "vid_uvc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
eframe = { version = "0.31.0", default-features = false, features = ["wgpu", "default_fonts", "wayland"] }
egui = "0.31.0"
enum-map = { version = "2.7.3", features = ["serde"] }
eye = { version = "0.5.0", path = "eye-rs/eye" }
inotify = "0.11.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1", features = ["full"] }
